<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TomTom connection test</title><style>body{font:17px -apple-system,system-ui,sans-serif;background:#101827;color:#fff;max-width:560px;margin:35px auto;padding:20px}button{background:#4b9cff;color:#081321;border:0;border-radius:12px;padding:15px 20px;font-size:17px;font-weight:700;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202c40;border-radius:12px;padding:18px}p{line-height:1.5}</style></head><body><h2>Leave for Work — TomTom test</h2><p>This tests an approximate Crib Point to Melbourne Airport route. It does not use your exact home address.</p><button id="go">Test connection</button><pre id="result">Ready to test.</pre><script>document.getElementById('go').addEventListener('click',async()=>{let result=document.getElementById('result');result.textContent='Contacting Worker…';try{const now=new Date();let target=new Date(now.getTime()+72*3600000);const iso=new Intl.DateTimeFormat('sv-SE',{timeZone:'Australia/Melbourne',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(target).replace(' ','T');let offset=(new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Melbourne',timeZoneName:'shortOffset'}).formatToParts(target).find(x=>x.type==='timeZoneName')?.value||'GMT+11').replace('GMT','');if(/^\+\d{1,2}$/.test(offset))offset+=':00';if(/^\+\d{2}:\d{2}$/.test(offset)===false)offset='+11:00';const response=await fetch('https://leave-for-work-api.kalebyarrow.workers.dev/',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({origin:[-38.35,145.20],destination:[-37.669,144.842],arriveAt:iso+offset})});const body=await response.text();result.textContent='HTTP '+response.status+'\n'+body;}catch(e){result.textContent='Browser connection error: '+e.message+'\n\nIf this mentions CORS or Failed to fetch, the Worker may need an OPTIONS/CORS adjustment.';}});</script></body></html>
